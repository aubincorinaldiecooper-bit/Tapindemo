name: Build Phonon image

on:
  push:
    branches: [main]
    paths:
      - 'phonon/**'
      - '.github/workflows/build-phonon-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tapin-phonon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: phonon
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Redeploy on Coolify
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_PHONON_APP_UUID: ${{ vars.COOLIFY_PHONON_APP_UUID || '3u2gpsarvj1k4xa2rdmtkmuq' }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_TOKEN" ] || [ -z "$COOLIFY_PHONON_APP_UUID" ]; then
            echo "Coolify token/app uuid not set; skipping redeploy (image is pushed)."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            "https://coolify.gnsis.studio/api/v1/deploy?uuid=$COOLIFY_PHONON_APP_UUID&force=true"
