name: Build rooms server image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/game.ts'
      - 'src/data.ts'
      - 'src/protocol.ts'
      - '.github/workflows/build-rooms-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tapin-rooms

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Coolify only pulls the image; tell it a new one is ready.
      - name: Redeploy on Coolify
        if: ${{ secrets.COOLIFY_DEPLOY_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}" \
            "https://coolify.gnsis.studio/api/v1/deploy?uuid=${{ vars.COOLIFY_ROOMS_APP_UUID || 'knvyhz6hqnlgvtjcnaqx28um' }}&force=true"
